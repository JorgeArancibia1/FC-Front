<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a3a"/>
      <stop offset="100%" style="stop-color:#0d5c2a"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Escudo -->
  <path d="M256 32 L448 96 L448 288 Q448 416 256 480 Q64 416 64 288 L64 96 Z" 
        fill="url(#shield)" stroke="#2dd4bf" stroke-width="8"/>
  
  <!-- Banda diagonal -->
  <path d="M64 160 L448 240 L448 320 L64 240 Z" fill="#2dd4bf" opacity="0.3"/>
  
  <!-- Balón de fútbol -->
  <circle cx="256" cy="280" r="80" fill="url(#ball)" stroke="#1a7a3a" stroke-width="4"/>
  <path d="M256 200 L256 360 M176 280 L336 280 M200 220 L316 340 M316 220 L200 340" 
        stroke="#1a7a3a" stroke-width="4" fill="none"/>
  <circle cx="256" cy="280" r="20" fill="#1a7a3a"/>
  
  <!-- Estrella -->
  <path d="M256 120 L268 156 L306 156 L276 180 L288 216 L256 192 L224 216 L236 180 L206 156 L244 156 Z" 
        fill="url(#star)" filter="url(#glow)"/>
  
  <!-- Texto GOL -->
  <text x="256" y="420" font-family="Arial Black, Arial, sans-serif" font-size="48" 
        font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GOL</text>
</svg>