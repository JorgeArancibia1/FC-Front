<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Escudo Simón FC">
  <defs>
    <!-- Fondo app (verde cancha del club) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b27" />
      <stop offset="0.5" stop-color="#0b1f16" />
      <stop offset="1" stop-color="#061410" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="72%">
      <stop offset="0" stop-color="#bef264" stop-opacity="0.28" />
      <stop offset="1" stop-color="#bef264" stop-opacity="0" />
    </radialGradient>
    <!-- Relleno del escudo -->
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12805a" />
      <stop offset="0.55" stop-color="#0b5c3b" />
      <stop offset="1" stop-color="#06301f" />
    </linearGradient>
    <!-- Banda diagonal -->
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfccb" />
      <stop offset="0.45" stop-color="#bef264" />
      <stop offset="1" stop-color="#65a30d" />
    </linearGradient>
    <clipPath id="crestClip">
      <path d="M256 76 L392 124 C412 131 424 148 424 168 V284 C424 378 352 448 256 472 C160 448 88 378 88 284 V168 C88 148 100 131 120 124 Z" />
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#glow)" />

  <!-- Escudo -->
  <path
    d="M256 76 L392 124 C412 131 424 148 424 168 V284 C424 378 352 448 256 472 C160 448 88 378 88 284 V168 C88 148 100 131 120 124 Z"
    fill="url(#crest)"
    stroke="#bef264"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Banda diagonal (sash) -->
  <g clip-path="url(#crestClip)">
    <rect x="-40" y="210" width="620" height="108" fill="url(#sash)" opacity="0.92" transform="rotate(-27 256 264)" />
  </g>

  <!-- Estrella -->
  <path
    d="M256 120 l7.6 15.4 17 2.5 -12.3 12 2.9 16.9 -15.2 -8 -15.2 8 2.9 -16.9 -12.3 -12 17 -2.5 Z"
    fill="#facc15"
    stroke="#a16207"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Balón -->
  <circle cx="256" cy="286" r="84" fill="#ffffff" stroke="#06301f" stroke-width="8" />
  <path d="M256 258 L281 276 L271 305 L241 305 L231 276 Z" fill="#06301f" />
  <g stroke="#06301f" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="258" x2="256" y2="206" />
    <line x1="281" y1="276" x2="330" y2="256" />
    <line x1="271" y1="305" x2="298" y2="352" />
    <line x1="241" y1="305" x2="214" y2="352" />
    <line x1="231" y1="276" x2="182" y2="256" />
  </g>
</svg>
